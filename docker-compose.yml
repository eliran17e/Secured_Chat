

services:
  mongo:
    image: mongo:7
    container_name: secured_chat_mongo
    # No published port: backend reaches Mongo over the internal docker network at mongo:27017.
    # Use `docker exec -it secured_chat_mongo mongosh` for admin access.
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: secured_chat_backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: secured_chat_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo_data:
